aid: poolside-ai
url: https://raw.githubusercontent.com/api-evangelist/poolside-ai/refs/heads/main/apis.yml
name: Poolside
kind: company
description: >-
  Poolside is an AI foundation model lab (founded 2023 by former GitHub CTO
  Jason Warner and Eiso Kant) building open-weight foundation models - the
  Laguna family - purpose-built for agentic software engineering. Poolside
  does not run a shared public SaaS API the way OpenAI or Groq do. Instead it
  publishes a full, public API reference (docs.poolside.ai) for an
  OpenAI-compatible inference API plus an admin/identity API, but the API
  itself only comes alive once a customer has a provisioned Poolside
  deployment - into their own AWS/Azure/Google Cloud VPC, on customer-owned
  NVIDIA GPU clusters via Helm, or fully air-gapped on-prem. There is no
  public signup page, free tier, or published pricing; access is arranged
  directly with Poolside's sales team. Separately, Poolside's smaller
  open-weight model, Laguna XS 2.1, can be called by anyone through
  third-party inference hosts such as OpenRouter, which is the closest thing
  to a public, self-serve way to hit a Poolside model over HTTP.

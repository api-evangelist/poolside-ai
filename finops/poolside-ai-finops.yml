alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Poolside
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Contract-Based
  billingFrequency: Custom
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
meters:
- name: enterprise_contract
  description: Negotiated annual/multi-year enterprise agreement for a Poolside deployment (Cloud VPC or on-prem/air-gapped). No published unit price.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - deployment
- name: deployment_infrastructure
  description: Underlying GPU compute, storage, and network cost of running the customer-controlled Poolside deployment (cloud instances or owned hardware).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
  - provider
- name: openrouter_laguna_tokens
  description: Tokens billed by OpenRouter (third party) when calling Poolside's open-weight Laguna XS 2.1 model through OpenRouter's API rather than a Poolside deployment.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
principles:
- name: Visibility
  description: Track the enterprise contract terms and the separate infrastructure bill (cloud VPC spend or owned GPU hardware amortization) for the Poolside deployment.
- name: Allocation
  description: Attribute deployment infrastructure cost to the team(s) or environment(s) the Poolside deployment serves, since Poolside itself does not meter per-team usage centrally.
- name: Optimization
  description: Right-size GPU capacity against the "hundreds of developers per node" reference point Poolside publishes, and evaluate OpenRouter's metered Laguna XS 2.1 access for lightweight/evaluation workloads before committing to a full deployment.
- name: Accountability
  description: Assign a named contract owner for the Poolside enterprise agreement and a named infrastructure owner for the deployment, since no self-serve billing dashboard exists.

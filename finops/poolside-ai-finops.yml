specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Poolside
providerId: poolside-ai
created: '2026-07-02'
modified: '2026-07-02'
reconciled: false
tags:
- AI
- Foundation Models
- Enterprise
- On-Prem
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Poolside spend. Because Poolside has no public price list,
  the dominant cost driver is a negotiated enterprise contract covering either
  a Cloud VPC deployment (AWS/Azure/Google) or an on-prem/air-gapped
  deployment (Poolside-pre-provisioned hardware or the customer's own NVIDIA
  GPU cluster via Helm), plus the underlying infrastructure spend for whichever
  path is chosen. There is no per-token metered invoice from Poolside itself
  to reconcile against FOCUS the way there is for a shared multi-tenant model
  API. The one metered, FOCUS-friendly cost surface tied to a Poolside model is
  third-party: calling the open-weight Laguna XS 2.1 model through OpenRouter,
  which bills per token under OpenRouter's own invoice, not Poolside's.
notes: >-
  Revisit this file if Poolside ships a public, metered API tier. Until then,
  cost governance is a hardware/contract-sizing exercise done directly with
  Poolside's sales team, and infrastructure cost tracking (GPU-hours, storage,
  network) for the customer-controlled deployment.
sources:
- https://poolside.ai/enterprise
- https://docs.poolside.ai/deployment/on-prem/admin
- https://openrouter.ai/poolside
